# =============================================================================
# OpenOCD configuration: Nucleo-F411RE
# =============================================================================
#
# The Nucleo-F411RE board has an on-board ST-LINK/V2-1 debug probe wired to
# the target STM32F411RE over SWD (Serial Wire Debug, 2 pins: SWDIO + SWCLK).
# When you plug the USB cable into the ST-LINK port, the host PC sees the
# probe; OpenOCD talks to the probe, the probe talks SWD to the MCU.
#
# Two files do the heavy lifting:
#   1. interface/stlink.cfg  -> how to talk to the debug adapter (ST-LINK)
#   2. target/stm32f4x.cfg   -> how to talk to the chip (STM32F4 family)
#
# `find` searches OpenOCD's built-in scripts directory
# (on this machine: /opt/homebrew/share/openocd/scripts/).
# =============================================================================

# --- Debug adapter ---------------------------------------------------------
# Generic ST-LINK config; auto-detects V2 / V2-1 / V3 by USB VID/PID.
source [find interface/stlink.cfg]

# --- Transport -------------------------------------------------------------
# STM32F4 Nucleo boards expose SWD only (no JTAG pins are broken out).
# `hla_swd` = High-Level Adapter SWD, the mode ST-LINK uses.
transport select hla_swd

# --- Target MCU ------------------------------------------------------------
# Covers the full STM32F4 family; the script reads the MCU's IDCODE at
# connect time and configures flash size, RAM size, and reset behavior.
source [find target/stm32f4x.cfg]

# --- Optional: speed -------------------------------------------------------
# 4 MHz SWD clock is reliable on Nucleo. Bump up if you want faster flashing.
adapter speed 4000
